app-id: io.github.natsummerance.readmd
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: readmd

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=host
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: readmd
    buildsystem: simple
    build-commands:
      - install -D -m 755 ReadMD /app/bin/readmd
      - cp -r assets /app/share/readmd/assets
      - cp -r src /app/share/readmd/src
      - install -D -m 644 io.github.natsummerance.readmd.desktop /app/share/applications/io.github.natsummerance.readmd.desktop
      - install -D -m 644 ReadMD.png /app/share/icons/hicolor/512x512/apps/io.github.natsummerance.readmd.png
      - install -D -m 644 readmd.xml /app/share/mime/packages/readmd.xml
    sources:
      - type: dir
        path: ../../
