name: Documentation feedback
description: Report unclear, missing or outdated documentation on GitHub or readmd.asia.
labels: ["documentation", "triage"]
assignees: ["Natsummerance"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Provide the README section, website URL or guide title.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, outdated or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Documentation language
      options:
        - Simplified Chinese
        - Traditional Chinese
        - English
        - Japanese
        - Multiple languages
    validations:
      required: true

