name: Native macOS test, package and release

on:
  push:
    branches: [main, 'codex/v2.2.1-macos']
    tags: ['v2.2.1']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  READMD_VERSION: '2.2.1'
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test native macOS · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test-macos.txt
      - name: Install macOS-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-macos.txt
      - name: Assert Windows projections are absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('winrt') is None
          assert importlib.util.find_spec('winreg') is None
          print('Windows-only modules are absent')
          PY
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install chromium
      - name: Run regression suite
        run: |
          python readmd_fix_test.py
          python readmd_convert_test.py
          python readmd_export_test.py
          python tools/privacy_scan.py
          python readmd.py --selftest
      - name: Run Playwright UI tests
        working-directory: ui-tests
        run: npm test

  package:
    name: Package native macOS · ${{ matrix.arch }}
    if: github.ref == 'refs/tags/v2.2.1'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-14
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test-macos.txt
      - name: Install macOS-only build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-macos.txt
      - name: Build and verify native app bundle
        run: |
          python -m PyInstaller --noconfirm --clean ReadMD-macOS.spec
          test "$(uname -m)" = "${{ matrix.machine }}"
          file dist/ReadMD.app/Contents/MacOS/ReadMD | grep "${{ matrix.machine }}"
          plutil -lint dist/ReadMD.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ReadMD.app/Contents/Info.plist)" = 'io.github.natsummerance.readmd'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadMD.app/Contents/Info.plist)" = "$READMD_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeRole' dist/ReadMD.app/Contents/Info.plist)" = 'Editor'
          if find dist/ReadMD.app -iname '*winrt*' -o -iname '*windows_native*' -o -iname '*winreg*' | grep .; then
            echo 'Windows-only dependency found in macOS bundle' >&2
            exit 1
          fi
          dist/ReadMD.app/Contents/MacOS/ReadMD --selftest
          if strings dist/ReadMD.app/Contents/MacOS/ReadMD | grep -Eiq 'sk-[A-Za-z0-9_-]{16,}'; then
            echo 'Privacy marker found in macOS executable' >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/ReadMD.app "ReadMD-macos-${{ matrix.arch }}-v${READMD_VERSION}.zip"
          unzip -t "ReadMD-macos-${{ matrix.arch }}-v${READMD_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-asset
          path: ReadMD-macos-${{ matrix.arch }}-v2.2.1.zip
          if-no-files-found: error

  release:
    name: Publish macOS v2.2.1 Release
    if: github.ref == 'refs/tags/v2.2.1'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-asset
          path: release-assets
          merge-multiple: true
      - name: Verify assets and checksums
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          test -s release-assets/ReadMD-macos-x64-v2.2.1.zip
          test -s release-assets/ReadMD-macos-arm64-v2.2.1.zip
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          name: ReadMD v2.2.1 for macOS
          body_path: release_notes_macos.md
          files: |
            release-assets/ReadMD-macos-x64-v2.2.1.zip
            release-assets/ReadMD-macos-arm64-v2.2.1.zip
          fail_on_unmatched_files: true
