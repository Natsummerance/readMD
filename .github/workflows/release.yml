name: Multi-Platform Rust Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: readmd.exe
            asset_name: ReadMD-windows-x64
            archive_ext: zip
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: readmd
            asset_name: ReadMD-linux-x86_64
            archive_ext: tar.gz
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: readmd
            asset_name: ReadMD-macos-arm64
            archive_ext: zip
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            bin_name: readmd
            asset_name: ReadMD-macos-x64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux build dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build release binary with Cargo
        run: cargo build --release -p readmd-kernel --target ${{ matrix.platform.target }}

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        run: |
          $pkgDir = "dist\ReadMD-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkgDir
          Copy-Item "rust\target\${{ matrix.platform.target }}\release\readmd.exe" -Destination "$pkgDir\ReadMD.exe"
          Copy-Item "assets" -Destination "$pkgDir\assets" -Recurse
          Copy-Item "LICENSE" -Destination "$pkgDir\LICENSE"
          Copy-Item "README.md" -Destination "$pkgDir\README.md"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "dist\${{ matrix.platform.asset_name }}.zip"

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          PKG_DIR="dist/ReadMD-linux-x86_64"
          mkdir -p "$PKG_DIR"
          cp "rust/target/${{ matrix.platform.target }}/release/readmd" "$PKG_DIR/ReadMD"
          cp -r assets "$PKG_DIR/assets"
          cp LICENSE README.md "$PKG_DIR/"
          tar -czvf "dist/${{ matrix.platform.asset_name }}.tar.gz" -C dist/ReadMD-linux-x86_64 .

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/ReadMD.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "rust/target/${{ matrix.platform.target }}/release/readmd" "$APP_DIR/Contents/MacOS/ReadMD"
          chmod +x "$APP_DIR/Contents/MacOS/ReadMD"
          if [ -f "assets/readmd.icns" ]; then
            cp "assets/readmd.icns" "$APP_DIR/Contents/Resources/"
          fi
          cp -r assets "$APP_DIR/Contents/Resources/"
          cat <<'PLIST' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>ReadMD</string>
              <key>CFBundleDisplayName</key>
              <string>ReadMD</string>
              <key>CFBundleIdentifier</key>
              <string>asia.readmd.desktop</string>
              <key>CFBundleVersion</key>
              <string>0.0.1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.0.1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>ReadMD</string>
              <key>CFBundleIconFile</key>
              <string>readmd.icns</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          cd dist
          zip -r "${{ matrix.platform.asset_name }}.zip" ReadMD.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_name }}
          path: dist/*.${{ matrix.platform.archive_ext }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
