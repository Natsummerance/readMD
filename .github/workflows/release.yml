name: Test, package and release ReadMD

on:
  push:
    branches: [main]
    tags: ['v2.2.2']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  READMD_VERSION: '2.2.2'
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: windows-x64
            requirements: requirements-test.txt
          - os: macos-15-intel
            arch: macos-x64
            requirements: requirements-test-macos.txt
          - os: macos-14
            arch: macos-arm64
            requirements: requirements-test-macos.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install platform dependencies
        run: python -m pip install --disable-pip-version-check -r ${{ matrix.requirements }}
      - name: Assert macOS excludes Windows projections
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('winrt') is None
          assert importlib.util.find_spec('winreg') is None
          print('Windows-only modules are absent')
          PY
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install chromium
      - name: Run Python regression suite
        run: |
          python readmd_fix_test.py
          python readmd_convert_test.py
          python readmd_export_test.py
          python readmd_web_test.py
          python tools/privacy_scan.py
          python readmd.py --selftest
      - name: Run Playwright UI tests
        working-directory: ui-tests
        run: npm test

  windows-package:
    name: Package · Windows x64
    if: github.ref == 'refs/tags/v2.2.2'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-windows.txt pyinstaller
      - run: python tools/make_icon.py
      - run: python tools/make_file_icon.py
      - name: Build and verify Windows assets
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ReadMD --icon assets/readmd.ico --add-data "assets;assets" --add-data "readmd_modules;readmd_modules" --add-data "readmd_fix.py;." --hidden-import readmd_fix --collect-data magika --collect-data docx --collect-data trafilatura --collect-submodules readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMD-portable --icon assets/readmd.ico --add-data "assets;assets" --add-data "readmd_modules;readmd_modules" --add-data "readmd_fix.py;." --hidden-import readmd_fix --collect-data magika --collect-data docx --collect-data trafilatura --collect-submodules readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDUninstall --icon assets/readmd.ico --add-data "installer;installer" installer/setup_app.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDSetup --icon assets/readmd.ico --add-data "installer;installer" --add-binary "dist/ReadMD;ReadMD" --add-binary "dist/ReadMDUninstall.exe;." installer/setup_app.py
          Move-Item dist/ReadMDSetup.exe "dist/ReadMDSetup-v$env:READMD_VERSION.exe"
          Move-Item dist/ReadMD-portable.exe "dist/ReadMD-portable-v$env:READMD_VERSION.exe"
          & "dist/ReadMD/ReadMD.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/ReadMD-portable-v$env:READMD_VERSION.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/ReadMDSetup-v$env:READMD_VERSION.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/ReadMD/_internal/assets/markdown-file.ico")) { throw "Markdown association icon missing" }
          python tools/privacy_scan.py dist/ReadMD "dist/ReadMD-portable-v$env:READMD_VERSION.exe" "dist/ReadMDSetup-v$env:READMD_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/ReadMDSetup-v2.2.2.exe
            dist/ReadMD-portable-v2.2.2.exe
          if-no-files-found: error

  macos-package:
    name: Package · macOS ${{ matrix.arch }}
    if: github.ref == 'refs/tags/v2.2.2'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-14
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test-macos.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-test-macos.txt
      - name: Build and verify native app bundle
        run: |
          python -m PyInstaller --noconfirm --clean ReadMD-macOS.spec
          test "$(uname -m)" = "${{ matrix.machine }}"
          file dist/ReadMD.app/Contents/MacOS/ReadMD | grep "${{ matrix.machine }}"
          plutil -lint dist/ReadMD.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ReadMD.app/Contents/Info.plist)" = 'io.github.natsummerance.readmd'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadMD.app/Contents/Info.plist)" = "$READMD_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeRole' dist/ReadMD.app/Contents/Info.plist)" = 'Editor'
          if find dist/ReadMD.app -iname '*winrt*' -o -iname '*windows_native*' -o -iname '*winreg*' | grep .; then
            echo 'Windows-only dependency found in macOS bundle' >&2
            exit 1
          fi
          test -s dist/ReadMD.app/Contents/Resources/assets/vendor/readability.bundle.js
          find dist/ReadMD.app -path '*/trafilatura/settings.cfg' -type f | grep .
          dist/ReadMD.app/Contents/MacOS/ReadMD --selftest
          python tools/privacy_scan.py dist/ReadMD.app
          ditto -c -k --sequesterRsrc --keepParent dist/ReadMD.app "ReadMD-macos-${{ matrix.arch }}-v${READMD_VERSION}.zip"
          unzip -t "ReadMD-macos-${{ matrix.arch }}-v${READMD_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ReadMD-macos-${{ matrix.arch }}-v2.2.2.zip
          if-no-files-found: error

  release:
    name: Publish ReadMD v2.2.2
    if: github.ref == 'refs/tags/v2.2.2'
    needs: [windows-package, macos-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify four assets and checksums
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          test -s release-assets/ReadMDSetup-v2.2.2.exe
          test -s release-assets/ReadMD-portable-v2.2.2.exe
          test -s release-assets/ReadMD-macos-x64-v2.2.2.zip
          test -s release-assets/ReadMD-macos-arm64-v2.2.2.zip
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          name: ReadMD v2.2.2
          body_path: release_notes.md
          files: |
            release-assets/ReadMDSetup-v2.2.2.exe
            release-assets/ReadMD-portable-v2.2.2.exe
            release-assets/ReadMD-macos-x64-v2.2.2.zip
            release-assets/ReadMD-macos-arm64-v2.2.2.zip
          fail_on_unmatched_files: true
