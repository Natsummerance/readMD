name: Test, package and release ReadMD

on:
  push:
    branches: [main]
    tags: ['v2.2.7', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  READMD_VERSION: '2.3.5'
  PYTHONUTF8: '1'


jobs:
  windows-test:
    name: Test · Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-test.txt
      - name: Install Windows test dependencies
        run: python -m pip install --disable-pip-version-check -r config/requirements-test.txt
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install chromium
      - name: Run Windows regression suite
        run: |
          python tests/test_fix_test.py
          python tests/test_convert_test.py
          python tests/test_export_test.py
          python tests/test_web_test.py
          python tests/test_api_test.py
          python tests/test_installer_setup_test.py
          python tests/test_v227_features_test.py
          python tests/test_v229_features_test.py
          python tests/test_performance_test.py
          python tools/privacy_scan.py
          python tests/test_v231_features_test.py
          python tests/test_v232_features_test.py
          python tests/test_i18n_coverage_test.py
          python readmd.py --selftest
      - name: Run Playwright UI tests
        working-directory: ui-tests
        run: npm test

  macos-test:
    name: Test · macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-14
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-test-macos.txt
      - name: Install macOS test dependencies
        run: python -m pip install --disable-pip-version-check -r config/requirements-test-macos.txt
      - name: Assert macOS excludes Windows projections
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('winrt') is None
          assert importlib.util.find_spec('winreg') is None
          print('Windows-only modules are absent')
          PY
      - name: Run parser, clipboard-bridge and self-test checks
        run: |
          python tests/test_fix_test.py
          python tests/test_convert_test.py
          python tests/test_api_test.py
          python tests/test_v227_features_test.py
          python tests/test_v229_features_test.py
          python tests/test_v231_features_test.py
          python tests/test_i18n_coverage_test.py
          python readmd.py --selftest


  linux-test:
    name: Test · Linux x64 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-test.txt
      - name: Install Linux test dependencies
        run: python -m pip install --disable-pip-version-check -r config/requirements-test.txt
      - name: Assert Linux native module detects platform
        run: python -c "import src.readmd_modules.linux_native as ln; assert ln.is_linux(), 'Not Linux'; distro = ln.detect_distro(); print('distro:', distro)"
      - name: Run Linux regression suite
        run: |
          python tests/test_fix_test.py
          python tests/test_convert_test.py
          python tests/test_api_test.py
          python tests/test_v231_features_test.py
          python tests/test_i18n_coverage_test.py
          python readmd.py --selftest

  windows-package:
    name: Package · Windows x64
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows-test, linux-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-windows.txt
      - run: python -m pip install --disable-pip-version-check -r config/requirements-windows.txt pyinstaller
      - run: python tools/make_icon.py
      - run: python tools/make_file_icon.py
      - name: Build, probe and smoke-test Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((python -c "import readmd; print(readmd.VERSION)") -ne $env:READMD_VERSION) { throw 'source version mismatch' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ReadMD --icon assets/readmd.ico --add-data "assets;assets" --add-data "src/readmd_modules;src/readmd_modules" --add-data "src/readmd_fix.py;src" --hidden-import src.readmd_fix --collect-data magika --collect-data docx --collect-data reportlab --collect-data matplotlib --collect-data trafilatura --collect-submodules src.readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMD-portable --icon assets/readmd.ico --add-data "assets;assets" --add-data "src/readmd_modules;src/readmd_modules" --add-data "src/readmd_fix.py;src" --hidden-import src.readmd_fix --collect-data magika --collect-data docx --collect-data reportlab --collect-data matplotlib --collect-data trafilatura --collect-submodules src.readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDUninstall --icon assets/readmd.ico --add-data "installer;installer" installer/setup_app.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDSetup --icon assets/readmd.ico --add-data "installer;installer" --add-binary "dist/ReadMD;ReadMD" --add-binary "dist/ReadMDUninstall.exe;." installer/setup_app.py
          Move-Item dist/ReadMDSetup.exe "dist/ReadMDSetup-v$env:READMD_VERSION.exe"
          Move-Item dist/ReadMD-portable.exe "dist/ReadMD-portable-v$env:READMD_VERSION.exe"
          $onedir = Start-Process -FilePath 'dist/ReadMD/ReadMD.exe' -ArgumentList '--selftest' -WindowStyle Hidden -Wait -PassThru
          if ($onedir.ExitCode -ne 0) { throw 'onedir selftest failed' }
          $portable = Start-Process -FilePath "dist/ReadMD-portable-v$env:READMD_VERSION.exe" -ArgumentList '--selftest' -WindowStyle Hidden -Wait -PassThru
          if ($portable.ExitCode -ne 0) { throw 'portable selftest failed' }
          $versionOutput = Join-Path $env:RUNNER_TEMP 'readmd-installer-version.txt'
          $installer = Start-Process -FilePath "dist/ReadMDSetup-v$env:READMD_VERSION.exe" -ArgumentList '--version' -RedirectStandardOutput $versionOutput -WindowStyle Hidden -Wait -PassThru
          $installerVersion = if (Test-Path $versionOutput) { (Get-Content $versionOutput -Raw).Trim() } else { '' }
          if ($installer.ExitCode -ne 0 -or $installerVersion -ne $env:READMD_VERSION) { throw 'installer version mismatch' }
          $probeProcess = Start-Process -FilePath 'dist/ReadMD/ReadMD.exe' -ArgumentList @('--startup-probe', '--startup-probe-json', 'dist/startup-probe.json', '--startup-probe-timeout', '30') -WindowStyle Hidden -Wait -PassThru
          if ($probeProcess.ExitCode -ne 0) { throw 'startup probe process failed' }
          $probe = Get-Content dist/startup-probe.json -Raw | ConvertFrom-Json
          if ($probe.version -ne $env:READMD_VERSION -or $probe.timed_out -or $null -eq $probe.milestones_ms.page_loaded) { throw 'startup probe failed' }
          if (!(Test-Path 'dist/ReadMD/_internal/assets/markdown-file.ico')) { throw 'Markdown association icon missing' }
          if (!(Test-Path 'dist/ReadMD/_internal/assets/vendor/defuddle.bundle.js')) { throw 'Defuddle bundle missing' }
          if (!(Test-Path 'dist/ReadMD/_internal/assets/vendor/defuddle.LICENSE.txt')) { throw 'Defuddle license missing' }
          if (!(Test-Path 'dist/ReadMD/_internal/assets/js/core/state.js')) { throw 'Modular JS assets missing' }
          python tools/privacy_scan.py dist/ReadMD "dist/ReadMD-portable-v$env:READMD_VERSION.exe" "dist/ReadMDSetup-v$env:READMD_VERSION.exe"
      - name: Build VSCode extension VSIX and MCP Server package
        run: |
          cd packages/vscode-extension
          npm ci
          npx --yes @vscode/vsce package --no-dependencies
          cd ../..
          python -c "import os, shutil, glob; os.makedirs('dist', exist_ok=True); vs = glob.glob('packages/vscode-extension/*.vsix'); assert vs, 'No vsix produced'; shutil.copy(sorted(vs)[-1], 'dist/readmd-vscode-${{ env.READMD_VERSION }}.vsix')"
          if (!(Test-Path "dist/readmd-vscode-$env:READMD_VERSION.vsix")) { throw "readmd-vscode-$env:READMD_VERSION.vsix missing in dist" }
          python -c "import zipfile; z = zipfile.ZipFile('dist/readmd-mcp-server-${{ env.READMD_VERSION }}.zip', 'w', zipfile.ZIP_DEFLATED); z.write('packages/mcp-server/readmd_mcp_server.py', 'readmd_mcp_server.py'); z.write('packages/mcp-server/README.md', 'README.md'); z.close()"
          if (!(Test-Path "dist/readmd-mcp-server-$env:READMD_VERSION.zip")) { throw "readmd-mcp-server-$env:READMD_VERSION.zip missing in dist" }
      - name: Upload main-branch release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rc-windows-${{ github.sha }}
          path: |
            dist/ReadMDSetup-v${{ env.READMD_VERSION }}.exe
            dist/ReadMD-portable-v${{ env.READMD_VERSION }}.exe
            dist/readmd-vscode-${{ env.READMD_VERSION }}.vsix
            dist/readmd-mcp-server-${{ env.READMD_VERSION }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/ReadMDSetup-v${{ env.READMD_VERSION }}.exe
            dist/ReadMD-portable-v${{ env.READMD_VERSION }}.exe
            dist/readmd-vscode-${{ env.READMD_VERSION }}.vsix
            dist/readmd-mcp-server-${{ env.READMD_VERSION }}.zip
          if-no-files-found: error
          overwrite: true

  macos-package:
    name: Package · macOS ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [macos-test, linux-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-14
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-test-macos.txt
      - run: python -m pip install --disable-pip-version-check -r config/requirements-test-macos.txt
      - name: Build and verify native app bundle
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean release/ReadMD-macOS.spec
          test "$(uname -m)" = "${{ matrix.machine }}"
          file dist/ReadMD.app/Contents/MacOS/ReadMD | grep "${{ matrix.machine }}"
          plutil -lint dist/ReadMD.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ReadMD.app/Contents/Info.plist)" = 'io.github.natsummerance.readmd'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadMD.app/Contents/Info.plist)" = "${{ env.READMD_VERSION }}"
          rm -rf dist/ReadMD.app/Contents/Resources/src/readmd_modules/windows_native* 2>/dev/null || true
          if find dist/ReadMD.app -iname '*winrt*' -o -iname '*windows_native*' -o -iname '*winreg*' | grep .; then
            echo 'Windows-only dependency found in macOS bundle' >&2
            exit 1
          fi
          mkdir -p dist/ReadMD.app/Contents/Resources/assets
          cp -R assets/* dist/ReadMD.app/Contents/Resources/assets/ 2>/dev/null || true
          test -s dist/ReadMD.app/Contents/Resources/assets/vendor/readability.bundle.js
          test -s dist/ReadMD.app/Contents/Resources/assets/vendor/defuddle.bundle.js
          test -s dist/ReadMD.app/Contents/Resources/assets/vendor/defuddle.LICENSE.txt
          test -s dist/ReadMD.app/Contents/Resources/assets/js/core/state.js
          dist/ReadMD.app/Contents/MacOS/ReadMD --selftest
          python tools/privacy_scan.py dist/ReadMD.app
          ditto -c -k --sequesterRsrc --keepParent dist/ReadMD.app "ReadMD-macos-${{ matrix.arch }}-v${{ env.READMD_VERSION }}.zip"
          unzip -t "ReadMD-macos-${{ matrix.arch }}-v${{ env.READMD_VERSION }}.zip"
      - name: Upload main-branch release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rc-macos-${{ matrix.arch }}-${{ github.sha }}
          path: ReadMD-macos-${{ matrix.arch }}-v${{ env.READMD_VERSION }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ReadMD-macos-${{ matrix.arch }}-v${{ env.READMD_VERSION }}.zip
          if-no-files-found: error
          overwrite: true

  linux-package:
    name: Package · Linux & HarmonyOS
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: config/requirements-linux.txt
      - name: Install system dependencies
        run: |
          for i in {1..3}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-0 \
            libgtk-3-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            tesseract-ocr \
            zip \
            file || true
          python -m pip install --disable-pip-version-check -r config/requirements-linux.txt pyinstaller
      - name: Build Linux onedir, AppImage, Deb, and HarmonyOS HAP
        run: |
          bash scripts/linux/build_linux.sh
      - name: Smoke test Linux binary
        run: |
          ./dist/ReadMD/ReadMD --selftest
      - name: Verify build outputs
        run: |
          ls -la dist/
          test -s "dist/ReadMD-harmonyos-v${{ env.READMD_VERSION }}.hap"
          test -s "dist/readmd_${{ env.READMD_VERSION }}_amd64.deb"
      - name: Upload main-branch release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: rc-linux-${{ github.sha }}
          path: |
            dist/ReadMD-linux-x86_64-v${{ env.READMD_VERSION }}.AppImage
            dist/readmd_${{ env.READMD_VERSION }}_amd64.deb
            dist/ReadMD-harmonyos-v${{ env.READMD_VERSION }}.hap
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Upload tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/ReadMD-linux-x86_64-v${{ env.READMD_VERSION }}.AppImage
            dist/readmd_${{ env.READMD_VERSION }}_amd64.deb
            dist/ReadMD-harmonyos-v${{ env.READMD_VERSION }}.hap
          if-no-files-found: ignore
          overwrite: true

  release:
    name: Publish ReadMD v2.3.5
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-package, macos-package, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify version, architecture, resources, privacy and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          root = 'release-assets'
          for dirpath, dirnames, filenames in os.walk(root, topdown=False):
              if os.path.abspath(dirpath) == os.path.abspath(root):
                  continue
              for f in filenames:
                  src = os.path.join(dirpath, f)
                  dst = os.path.join(root, f)
                  if not os.path.exists(dst):
                      shutil.move(src, dst)
              try:
                  os.rmdir(dirpath)
              except Exception:
                  pass
          print("Flattened release-assets:")
          for f in sorted(os.listdir(root)):
              print(" -", f)
          PY
          for asset in ReadMDSetup-v2.3.5.exe ReadMD-portable-v2.3.5.exe ReadMD-macos-x64-v2.3.5.zip ReadMD-macos-arm64-v2.3.5.zip readmd-vscode-2.3.5.vsix readmd_2.3.5_amd64.deb ReadMD-harmonyos-v2.3.5.hap readmd-mcp-server-2.3.5.zip; do
            test -s "release-assets/$asset"
          done
          grep -F "or _bundle_version() or '2.3.5'" readmd.py
          grep -F "or _bundle_version() or '2.3.5'" installer/setup_app.py
          python -c "import readmd; assert readmd.VERSION == '2.3.5'"
          test -s assets/vendor/defuddle.bundle.js
          test -s assets/vendor/defuddle.LICENSE.txt
          test -s assets/js/core/state.js
          rm -rf verify-macos
          mkdir -p verify-macos/x64 verify-macos/arm64
          unzip -q release-assets/ReadMD-macos-x64-v2.3.5.zip -d verify-macos/x64
          unzip -q release-assets/ReadMD-macos-arm64-v2.3.5.zip -d verify-macos/arm64
          python - <<'PY'
          import plistlib
          for arch in ('x64', 'arm64'):
              with open('verify-macos/%s/ReadMD.app/Contents/Info.plist' % arch, 'rb') as handle:
                  info = plistlib.load(handle)
              assert info['CFBundleShortVersionString'] == '2.3.5', (arch, info)
          print('macOS bundle versions OK')
          PY
          file verify-macos/x64/ReadMD.app/Contents/MacOS/ReadMD | grep -E 'x86_64|x86-64'
          file verify-macos/arm64/ReadMD.app/Contents/MacOS/ReadMD | grep -E 'arm64|aarch64'
          for arch in x64 arm64; do
            test -s "verify-macos/$arch/ReadMD.app/Contents/Resources/assets/vendor/defuddle.bundle.js"
            test -s "verify-macos/$arch/ReadMD.app/Contents/Resources/assets/vendor/defuddle.LICENSE.txt"
            test -s "verify-macos/$arch/ReadMD.app/Contents/Resources/assets/js/core/state.js"
          done
          python tools/privacy_scan.py
          python - <<'PY'
          import hashlib, os
          root = 'release-assets'
          files = [f for f in sorted(os.listdir(root)) if os.path.isfile(os.path.join(root, f)) and f != 'SHA256SUMS.txt']
          sums = []
          for f in files:
              h = hashlib.sha256()
              with open(os.path.join(root, f), 'rb') as handle:
                  while chunk := handle.read(65536):
                      h.update(chunk)
              sums.append(f"{h.hexdigest()}  {f}")
          out_content = "\n".join(sums) + "\n"
          with open(os.path.join(root, 'SHA256SUMS.txt'), 'w', encoding='utf-8') as handle:
              handle.write(out_content)
          print("Generated SHA256SUMS.txt:")
          print(out_content)
          PY
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          name: ReadMD v2.3.5
          body_path: release/release_notes.md
          files: release-assets/*
          fail_on_unmatched_files: true


