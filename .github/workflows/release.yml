name: Test, package and release

on:
  push:
    branches: [main]
    tags: ['v2.2.0']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  READMD_VERSION: '2.2.0'
  PYTHONUTF8: '1'

jobs:
  test:
    name: Test · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Install Playwright
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install chromium
      - name: Run regression suite
        run: |
          python readmd_fix_test.py
          python readmd_convert_test.py
          python readmd_export_test.py
          python tools/privacy_scan.py
          python readmd.py --selftest
      - name: Run Playwright UI tests
        working-directory: ui-tests
        run: npm test

  windows-package:
    name: Package · Windows
    if: github.ref == 'refs/tags/v2.2.0'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller
      - run: python tools/make_icon.py
      - name: Build application and installer
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ReadMD --icon assets/readmd.ico --add-data "assets;assets" --add-data "readmd_modules;readmd_modules" --add-data "readmd_fix.py;." --hidden-import readmd_fix --collect-data magika --collect-data docx --collect-submodules readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMD-portable --icon assets/readmd.ico --add-data "assets;assets" --add-data "readmd_modules;readmd_modules" --add-data "readmd_fix.py;." --hidden-import readmd_fix --collect-data magika --collect-data docx --collect-submodules readmd_modules readmd.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDUninstall --icon assets/readmd.ico --add-data "installer;installer" installer/setup_app.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReadMDSetup --icon assets/readmd.ico --add-data "installer;installer" --add-binary "dist/ReadMD;ReadMD" --add-binary "dist/ReadMDUninstall.exe;." installer/setup_app.py
          Move-Item dist/ReadMDSetup.exe "dist/ReadMDSetup-v$env:READMD_VERSION.exe"
          Move-Item dist/ReadMD-portable.exe "dist/ReadMD-portable-v$env:READMD_VERSION.exe"
          & "dist/ReadMD/ReadMD.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/ReadMD-portable-v$env:READMD_VERSION.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/ReadMDSetup-v$env:READMD_VERSION.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/ReadMDSetup-v2.2.0.exe
            dist/ReadMD-portable-v2.2.0.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/tags/v2.2.0'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets
      - name: Verify assets and checksums
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          test -s release-assets/ReadMDSetup-v2.2.0.exe
          test -s release-assets/ReadMD-portable-v2.2.0.exe
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          echo '### SHA-256' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          name: ReadMD v2.2.0
          body_path: release_notes.md
          files: |
            release-assets/ReadMDSetup-v2.2.0.exe
            release-assets/ReadMD-portable-v2.2.0.exe
          fail_on_unmatched_files: true
