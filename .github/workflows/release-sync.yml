name: Sync main release candidates

on:
  workflow_run:
    workflows: ["Test, package and release ReadMD"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  update-beta-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip stale candidates
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$EXPECTED_COMMIT" != "$current" ]; then
            echo "A newer main commit is available; skipping $EXPECTED_COMMIT"
            exit 0
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: rc-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage and switch existing prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '\n' < VERSION)"
          python tools/release_asset_sync.py \
            --assets-dir release-assets \
            --tag "v$(tr -d '\n' < VERSION)" \
            --commit "${{ github.event.workflow_run.head_sha }}" \
            --repo "$GH_REPO"
          gh release edit "$tag" --notes-file release/release_notes.md

      - name: Summarize sync
        run: |
          {
            echo "### Release candidates synced"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Assets: $(find release-assets -maxdepth 1 -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
