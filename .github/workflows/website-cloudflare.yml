name: Website Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: website-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build verified release
        working-directory: website
        run: npm run build
      - name: Validate release contract
        run: python3 showcase/scripts/validate_website.py --release
      - uses: actions/upload-artifact@v4
        with:
          name: readmd-site-dist
          path: website/dist
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build verified release
        working-directory: website
        run: npm run verify:release
      - name: Deploy to Cloudflare Workers
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.worker.jsonc
