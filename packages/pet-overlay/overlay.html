<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
  #pet{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;cursor:grab;touch-action:none}
  #pet.dragging{cursor:grabbing}
</style>
<img id="pet" src="assets/hermes-sprite.png" alt="">
<script>
  (() => {
    const pet = document.getElementById('pet')
    let active = false
    const point = event => ({ screenX: event.screenX, screenY: event.screenY })
    pet.addEventListener('pointerdown', event => {
      active = true
      pet.classList.add('dragging')
      pet.setPointerCapture?.(event.pointerId)
      void window.readmdPet.beginDrag(point(event))
    })
    pet.addEventListener('pointermove', event => { if (active) window.readmdPet.moveDrag(point(event)) })
    const end = event => {
      if (!active) return
      active = false
      pet.classList.remove('dragging')
      window.readmdPet.endDrag()
      pet.releasePointerCapture?.(event.pointerId)
    }
    pet.addEventListener('pointerup', end)
    pet.addEventListener('pointercancel', end)
    pet.addEventListener('dblclick', () => window.readmdPet.close())
  })()
</script>
</html>
