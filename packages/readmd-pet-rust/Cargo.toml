[package]
name = "readmd-pet-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Production native ReadMD desktop pet host"

[lib]
name = "readmd_pet_rust"
path = "src/lib.rs"

[[bin]]
name = "readmd-pet-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
url = "2.5"
percent-encoding = "2.3"
raw-window-handle = "0.6"
tao = { version = "0.37", features = ["rwh_06"] }
wry = { version = "0.57", features = ["os-webview"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", default-features = false }
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
